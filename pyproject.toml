[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fina-maths-lib"
version = "0.1.1"
description = "Deterministic financial maths formula library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "Fina Maths Lib Contributors" }
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["finance", "quant", "math", "formulas", "analytics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/vickyPotheesh2004/finbench_agent-Multi_Agent_Business_Analyst_System"
Repository = "https://github.com/vickyPotheesh2004/finbench_agent-Multi_Agent_Business_Analyst_System"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
